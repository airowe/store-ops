  <text x="120" y="760" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#f4f6fa">app.shipaso.com → Settings › Plan → code SHIPATON26</text>
  <rect x="120" y="800" width="1360" height="1" fill="#1a2130"/>
  <text x="120" y="852" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#828ca3">Claims close Oct 13. Never replaces a plan that already covers more. Never submits to the store for you.</text>
