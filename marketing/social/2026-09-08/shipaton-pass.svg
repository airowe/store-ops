<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#07090e"/>
  <rect width="1600" height="8" fill="#34d399"/>
  <text x="120" y="140" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#828ca3">shipaso.com/#shipaton · #Shipaton 2026 · we're entrants too</text>
  <text x="120" y="250" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="bold" fill="#f4f6fa">Building a Shipaton app?</text>
  <text x="120" y="336" font-family="Helvetica, Arial, sans-serif" font-size="70" font-weight="bold" fill="#f4f6fa">Startup is free until Dec 31.</text>
  <rect x="120" y="390" width="1360" height="290" rx="14" fill="#0b0e14" stroke="#1a2130"/>
  <text x="160" y="450" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#828ca3">plan        </text>
  <text x="520" y="450" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#34d399">Startup · $19.99/mo · $0 for entrants</text>
  <text x="160" y="500" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#828ca3">apps        </text>
  <text x="520" y="500" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#34d399">up to 10 connected</text>
  <text x="160" y="550" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#828ca3">the loop    </text>
  <text x="520" y="550" font-family="Menlo, 'JetBrains Mono', monospace" font-size="28" fill="#34d399">weekly sweep · it proposes, you approve</text>
