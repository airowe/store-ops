<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#07090e"/>
  <rect width="1600" height="8" fill="#34d399"/>

  <text x="120" y="140" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#828ca3">shipaso.com/journey · #BuildInPublic</text>

  <text x="120" y="258" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="bold" fill="#f4f6fa">The model writes.</text>
  <text x="120" y="354" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="bold" fill="#34d399">Reality validates.</text>

  <text x="120" y="440" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#828ca3">Claude proposes a subtitle. Deterministic guardrails decide if it ships.</text>

  <rect x="120" y="500" width="1360" height="1" fill="#1a2130"/>

  <text x="120" y="562" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#34d399" letter-spacing="2">THE GUARDRAILS</text>

  <text x="120" y="636" font-family="Menlo, monospace" font-size="34" fill="#34d399">✓</text>
  <text x="172" y="636" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#f4f6fa">Hard 30-character limit</text>

  <text x="120" y="702" font-family="Menlo, monospace" font-size="34" fill="#34d399">✓</text>
  <text x="172" y="702" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#f4f6fa">Must carry a target keyword</text>

  <text x="120" y="768" font-family="Menlo, monospace" font-size="34" fill="#34d399">✓</text>
  <text x="172" y="768" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#f4f6fa">No price claims, no brand words</text>

  <rect x="820" y="530" width="1" height="260" fill="#1a2130"/>

  <text x="900" y="562" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#828ca3" letter-spacing="2">WHEN IT MISSES</text>

  <text x="900" y="636" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#f4f6fa">Falls back to the</text>
  <text x="900" y="686" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#f4f6fa">deterministic composer.</text>
  <text x="900" y="768" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#34d399">You still approve every run.</text>

  <text x="120" y="838" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#34d399">An AI agent with an AI brain — that still can't ship without you.</text>
</svg>
