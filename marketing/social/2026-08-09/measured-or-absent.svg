  <text x="120" y="582" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="bold" fill="#34d399">the receipt.</text>

  <rect x="120" y="660" width="1360" height="1" fill="#1a2130"/>

  <text x="120" y="722" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#828ca3">Measured a rank?</text>
