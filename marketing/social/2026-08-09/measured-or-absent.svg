  <text x="740" y="784" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#828ca3">You get “—”. Never a guess.</text>

  <text x="120" y="858" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#34d399">My RevenueCat Shipaton entry — the whole build is public.</text>
