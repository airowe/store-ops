# Auto-deploy to Cloudflare on merge to main — gated on the test suite.
#
# Flow: install → typecheck → test → (only if green) deploy the Worker, then the
# Pages dashboard. A red build never reaches production.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a scoped token (see SETUP below)
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#
# SETUP (one-time, owner only):
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token.
#      Use the "Edit Cloudflare Workers" template, then ADD permissions:
#        - Account · Workers Scripts · Edit
#        - Account · Cloudflare Pages · Edit
#        - Account · D1 · Edit            (only if CI ever runs migrations)
#      Scope it to the account + the shipaso.com zone. Copy the token.
#   2. Cloudflare dashboard → account home → copy the Account ID (right sidebar).
#   3. Add both as the repo secrets named above.
#   The workflow stays inert until those secrets exist.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual runs from the Actions tab

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # issues:write is for the failure alert below — a broken deploy on main used
    # to fail silently (10 merges shipped nowhere before anyone noticed).
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install
        run: npm ci

      # ── quality gate: a failure here stops the deploy ──
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # E2E now belongs to the app (the dashboard suite drove cloud/public,
      # deleted in #356 Phase 3). It runs from cloud/web against the built dist
      # + a Playwright-routed mock backend — no live Worker/D1/network. This is
      # a DEPLOY gate, so it must stay: a failure here stops the deploy.
      - name: Install web deps
        working-directory: cloud/web
        run: npm ci

      - name: Build web app
        working-directory: cloud/web
        run: npm run build

      - name: Install Playwright browser
        working-directory: cloud/web
        run: npx playwright install --with-deps chromium

      - name: E2E (redesign happy path vs mock backend)
        # Serial + 1 retry, matching ci.yml and the local pre-push gate: a local
        # or CI gate should never false-block on parallelism flake, and the retry
        # absorbs residual one-offs without masking a real failure.
        working-directory: cloud/web
        run: npm run test:e2e -- --workers=1 --retries=1

      # ── deploy gate: only deploy when the Cloudflare secrets are configured.
      # Keeps the workflow green (gates still run) before one-time secret setup,
      # instead of failing loudly on a missing CLOUDFLARE_API_TOKEN.
      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy. Add CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets to enable auto-deploy (see .github/workflows/deploy.yml header)."
          fi

      # ── apply D1 migrations BEFORE the new code goes live ──
      # wrangler tracks applied migrations (d1_migrations table) and runs ONLY the
      # new files in cloud/migrations, so this is safe on every deploy and handles
      # one-way changes (ALTER TABLE) exactly once. Runs first so the schema the
      # new Worker expects already exists when it deploys. Requires the token to
      # have Account · D1 · Edit — a failure here stops the deploy on purpose (a
      # schema that can't apply must not be masked). See cloud/migrations/README.md.
      - name: Apply D1 migrations
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: d1 migrations apply store_ops --remote

      # ── deploy the Worker (API at api.shipaso.com) ──
      - name: Deploy Worker
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: deploy

      # ── build the Pages bundle: the app IS the site (#356 Phase 3) ──
      # build:combined = build:web (vite → cloud/web/dist, content-hashed
      # assets + public/ copied verbatim) then web-enable.mjs, which makes that
      # build the deploy root and emits the advanced-mode _worker.js.
      #
      # It used to stitch the app INTO the legacy stamped dashboard: dist/ was
      # legacy, index.html was legacy, and the app lived at _web.html for owned
      # paths only. Legacy is gone, so the nesting is inverted — the app is the
      # root, unknown paths get its 404, and public/ carries _headers,
      # config.js, /auth/m and .well-known/* across.
      - name: Build Pages bundle (app + edge worker)
        if: steps.creds.outputs.configured == 'true'
        run: npm run build:combined

      # ── deploy the dashboard (Pages at app.shipaso.com) ──
      - name: Deploy Pages dashboard
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          command: pages deploy dist --project-name store-ops-dashboard --branch main

      # ── deploy the marketing site (Pages at shipaso.com) ──
      # `docs/landing/` is a self-contained static site (index.html +
      # check-your-rank.html, no build) served by the `store-ops-site` Pages
      # project. It used to be deployed by hand — so edits sat unshipped (the
      # project was Git-disconnected and untouched for a month). Codified here so
      # a merge to main ships shipaso.com the same way it ships the API and the
      # dashboard. Root workingDirectory because the dir lives at the repo root.
      - name: Deploy marketing site
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: pages deploy docs/landing --project-name store-ops-site --branch main

      # ── failure alert: a red deploy on main must be LOUD ──
      # Opens (or comments on) a pinned-by-title issue so a broken deploy can't
      # fail silently across merges (the 2026-07-04 token episode: 10 merges
      # deployed nothing before anyone noticed). Uses the run's own token.
      - name: Alert on deploy failure (open/update issue)
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="deploy to production is failing"
          BODY="Deploy run failed: $RUN_URL (commit ${GITHUB_SHA:0:7}).

          Merges to main are NOT reaching production until this is fixed. Check the run log — historically this is the Cloudflare API token (the header of .github/workflows/deploy.yml documents the permissions it needs: Workers Scripts Edit, Cloudflare Pages Edit, D1 Edit, zone Workers Routes Edit)."
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "🚨 $TITLE" --body "$BODY"
          fi
