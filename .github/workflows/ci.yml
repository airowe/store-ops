# PR checks — the quality gate that runs BEFORE merge.
#
# deploy.yml runs the same gate on push to main and then deploys; by then a red
# build has already landed. This workflow runs typecheck → test → e2e on every
# pull request targeting main, so a PR shows a green/red check before it's merged
# (and merges can be required to wait on it via branch protection). It NEVER
# deploys and needs no secrets — it's purely the gate.

name: ci

on:
  pull_request:
    branches: [main]
  # allow re-running the gate by hand from the Actions tab
  workflow_dispatch: {}

# A newer push to the same PR supersedes an in-flight check run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: the real-schema regression specs (d1.*Schema.spec.ts) use
      # node:sqlite, which only exists on Node ≥ 22.5 and SKIPS below it. On Node 20
      # they were silently skipped in CI — which is how a schema.sql/code mismatch
      # (rank_snapshots.country moved to a migration) slipped through green. Node 22
      # runs those guards so the gate actually catches this class of drift.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The dashboard E2E lived here and drove cloud/public via a static server.
      # Both went with the legacy dashboard (#356 Phase 3); the app's own E2E
      # runs in the `web` job below.

  # Shared spine (PRD 01): design-token source-of-truth parity, pure honesty
  # helpers, and the transport-agnostic API client types. Dependency-light + fast
  # — its own job so a spine regression is a distinct red check.
  spine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (token parity + honesty + typecheck)
        run: npm test

  # New TanStack web dashboard (PRD 02+). Migrates cloud/public/app.js
  # route-by-route; consumes the @shipaso spine by path alias. Its own job:
  # typecheck + unit tests + a production build (build success = the spine wiring
  # + router bundle are sound). Not yet deployed — coexists behind the edge map.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (redesign happy path vs mock backend)
        # Serves the built dist (SPA fallback) + a Playwright-routed mock backend
        # — no live Worker/D1/network. Serial + 1 retry mirrors the dashboard e2e
        # in the `check` job (a shared static-server port, absorbs residual flake).
        run: npm run test:e2e -- --workers=1 --retries=1
