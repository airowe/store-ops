# PR checks — the quality gate that runs BEFORE merge.
#
# deploy.yml runs the same gate on push to main and then deploys; by then a red
# build has already landed. This workflow runs typecheck → test → e2e on every
# pull request targeting main, so a PR shows a green/red check before it's merged
# (and merges can be required to wait on it via branch protection). It NEVER
# deploys and needs no secrets — it's purely the gate.

name: ci

on:
  pull_request:
    branches: [main]
  # allow re-running the gate by hand from the Actions tab
  workflow_dispatch: {}

# A newer push to the same PR supersedes an in-flight check run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: the real-schema regression specs (d1.*Schema.spec.ts) use
      # node:sqlite, which only exists on Node ≥ 22.5 and SKIPS below it. On Node 20
      # they were silently skipped in CI — which is how a schema.sql/code mismatch
      # (rank_snapshots.country moved to a migration) slipped through green. Node 22
      # runs those guards so the gate actually catches this class of drift.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The dashboard E2E lived here and drove cloud/public via a static server.
      # Both went with the legacy dashboard (#356 Phase 3); the app's own E2E
      # runs in the `web` job below.

  # Shared spine (PRD 01): design-token source-of-truth parity, pure honesty
  # helpers, and the transport-agnostic API client types. Dependency-light + fast
  # — its own job so a spine regression is a distinct red check.
  spine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (token parity + honesty + typecheck)
        run: npm test

  # Skill commands (#241): every `asc …` command our skills document must exist
  # in the real CLI. Three stale commands (`asc pre-release-versions list`,
  # `asc app-info set`, `asc app-infos list`) shipped documented-as-deprecated
  # while actually being absent — a first-time user hits `Unknown command`.
  #
  # The linter builds its command tree from the CLI's live --help, so the runner
  # must actually have `asc`. --require makes an absent CLI exit 2: without it
  # the linter skips silently and reports "0 missing" having checked nothing.
  #
  # Pinned deliberately. A float would turn an upstream release into a surprise
  # red check on an unrelated PR; bumping this pin is how we notice the CLI moved.
  skill-commands:
    runs-on: ubuntu-latest
    env:
      ASC_VERSION: 3.6.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install asc ${{ env.ASC_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/rorkai/App-Store-Connect-CLI/releases/download/${ASC_VERSION}/asc_${ASC_VERSION}_linux_amd64"
          curl -fsSL --retry 3 -o /usr/local/bin/asc "$url"
          chmod +x /usr/local/bin/asc
          asc --version

      # No credentials needed: --help is read from the binary, never the network.
      - name: Lint documented skill commands
        run: node scripts/lint-skill-commands.mjs --require=asc

  # The TanStack web dashboard (PRD 02+) — since #356 Phase 3 this IS the site:
  # cloud/public/ and the strangler edge map are gone, and this build's dist/ is
  # the Pages deploy root. Consumes the @shipaso spine by path alias. Its own
  # job: typecheck + unit tests + a production build (build success = the spine
  # wiring + router bundle are sound) + the app's E2E against the built dist.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E (redesign happy path vs mock backend)
        # Serves the built dist (SPA fallback) + a Playwright-routed mock backend
        # — no live Worker/D1/network. Serial + 1 retry mirrors the dashboard e2e
        # in the `check` job (a shared static-server port, absorbs residual flake).
        run: npm run test:e2e -- --workers=1 --retries=1
