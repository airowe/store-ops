<meta name="robots" content="noindex">
<!--
  Cloudflare Pages serves this file, with a real 404 status, for any path that
  does not match a file in this directory.

  Before it existed, every unknown path returned 200 with the site shell —
  including /robots.txt and /llms.txt, which meant a crawler asking for a
  robots file got an HTML page and a success code. A malformed robots.txt is
  resolved differently by different crawlers, so that single gap put the whole
  site's crawl behaviour in doubt.

  Same fix as #368 did for the app; the marketing site is a separate Pages
  project and never got it.

  Deliberately plain: no JS, no dependencies, no invented explanation of what
  the visitor meant to reach.
-->
<style>
  :root { color-scheme: dark light; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; gap: 1rem;
    padding: 2rem; text-align: center;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #07090e; color: #eef1f7;

  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }

  @media (prefers-color-scheme: light) {

    p { color: #55606f; }
  }
</style>
