# wrangler.toml — store-ops Cloudflare Worker (API + agent engine + weekly cron)
#
# This is the BACKEND (Worker). The dashboard frontend ships separately to
# Cloudflare Pages (see "Pages" note at the bottom + README).
#
# Quick start:
#   1) npm install
#   2) npx wrangler d1 create store_ops        # creates the DB, prints a database_id
#   3) paste that id into `database_id` below   # <-- FILL ME IN
#   4) npm run db:migrate:local                 # apply the schema.sql BASELINE (local)
#   5) npm run dev                              # wrangler dev (local Worker + D1)
#   6) npm run db:migrate && npm run deploy     # baseline on remote, then deploy
#      (deploy auto-applies migrations/ on every push to main — see migrations/README.md)

name = "store-ops"
main = "src/index.ts"
compatibility_date = "2025-01-01"
# nodejs_compat gives us node: built-ins if the ported engine ever needs them.
compatibility_flags = ["nodejs_compat"]

# ── Custom domain — the API on-brand at api.shipaso.com ──────────────────────
# `custom_domain = true` makes `wrangler deploy` provision the DNS record + cert
# on the shipaso.com zone automatically. The workers.dev URL stays live too, so
# the dashboard's existing API_BASE keeps working during the cutover.
[[routes]]
pattern = "api.shipaso.com"
custom_domain = true

# ── Public report pages on the brand domain (loop 2, 2026-09-05) ──────────────
# GET /r/:appId renders a public report as an indexable HTML page. Routing
# `shipaso.com/r/*` here puts those pages on the marketing domain instead of
# api.shipaso.com; Workers routes take precedence over the Pages site on the
# same hostname for matching paths only. This hunk and REPORT_PAGE_ORIGIN
# below are a PAIR: drop both to keep the pages on api.shipaso.com — the
# canonical then falls back to the request origin, so it never names a 404.
[[routes]]
pattern = "shipaso.com/r/*"
zone_name = "shipaso.com"

# ── D1 (SQLite) — bound as env.DB in the Worker ──────────────────────────────
# ── Rate limiting — damps repeat hits on the public funnels ─────────────────
# Used by GET /report/:appId and by the anonymous MCP `preview_app` (POST /mcp
# with no key — the front door, loop 2026-09-05). Each cache MISS on those paths
# runs the agent, which reasons with the Anthropic client, so an unauthenticated
# caller can spend inference budget on our key.
#
# Read the caveats before trusting this. Cloudflare documents the binding as
# "permissive, eventually consistent, and intentionally designed to not be used
# as an accurate accounting system", and a limit applies PER CLOUDFLARE
# LOCATION — a caller spread across locations gets a multiple of it. The cache
# in api/publicReportGuard.ts is what actually bounds the cost; this only stops
# one app being hammered.
#
# `period` accepts only 10 or 60. The binding is unset in local dev, which the
# code treats as "no damper" rather than "refuse everyone".
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[[d1_databases]]
binding = "DB"                 # code reads it as `env.DB`
database_name = "store_ops"
# database_id: FILL ME IN — run `npx wrangler d1 create store_ops` and paste the
# printed id here. Until then `wrangler dev` works against the LOCAL D1 only.
database_id = "30f6f8cf-90a5-4646-936f-8899ec4f62f6"
# Incremental forward migrations (see migrations/README.md). Applied on deploy via
# `wrangler d1 migrations apply store_ops --remote`; wrangler runs only new ones.
migrations_dir = "migrations"

# ── Cron Triggers — two schedules, dispatched in scheduled() on event.cron ───
# "0 * * * *" = HOURLY → the autonomous-sweep SCHEDULER (#52): each app is swept
#   only when its stored schedule (app_settings.schedule_json — default weekly
#   Monday 09:00 UTC, the historical behavior) says it's due. Cloudflare crons
#   are global, not per-record, so per-app cadence lives in D1 and the hourly
#   tick just asks "is this app due?" (isSweepDue) — cheap D1 reads; the real
#   agent work runs only for due apps.
# "0 8 * * *" = daily 08:00 UTC → the lightweight DAILY rank SNAPSHOT (#94): for
#   apps whose owner set rank_cadence='daily' it records a dated rank_snapshots row
#   and NOTHING else — no proposals, no approval runs, no push. Two triggers fit
#   Cloudflare's per-Worker cron budget (max 5). src/index.ts branches on the cron
#   expression so the daily trigger NEVER runs the sweep scheduler and vice-versa.
[triggers]
crons = ["0 * * * *", "0 8 * * *"]

# ── Workers AI — bound as env.AI (#57) ───────────────────────────────────────
# Powers the keyword-reasoning step (engine/keywordReasoner.ts): the run path
# asks a small instruct model to classify title tokens + suggest description-
# derived target keywords, then guardrails the output against the listing text.
# OPTIONAL at runtime: if the binding is absent (e.g. local dev without AI), the
# run derives keywords with the deterministic classifier instead — a missing
# binding never breaks a run.
#
# ENABLED: the LLM reasons over the app's description to propose grounded intent
# keywords for ANY app (including ones whose name doesn't describe what they do).
# Safety: every model error degrades to the deterministic classifier (run never
# breaks), and the guardrails (no invention — targets must be substantiated by
# the description/keyword field; rank-checked before shown) keep it honest. The
# real ASC keyword field still takes precedence (#75) — the LLM enriches, it
# doesn't override the user's own curated keywords.
[ai]
binding = "AI"

# ── Vars (non-secret config) ─────────────────────────────────────────────────
[vars]
DEFAULT_COUNTRY = "US"
# APP_ENV drives env-specific auth/billing behavior. In "demo" the X-User-Email
# header is accepted (alongside real session cookies) and SESSION_SECRET may be
# unset (an insecure dev fallback is used, with a warning). Set APP_ENV to
# anything else (e.g. "production") to REQUIRE SESSION_SECRET and DISABLE the
# X-User-Email fallback — only signed session cookies authenticate.
APP_ENV = "production"
# DASHBOARD_ORIGIN — the canonical dashboard origin. Echoed on CORS responses
# (must be a concrete origin, not "*", because cookies are sent with credentials)
# AND used to build the post-login + Stripe redirect targets, so the browser
# lands on the dashboard (not the bare Worker) after the magic link / checkout.
DASHBOARD_ORIGIN = "https://app.shipaso.com"
# API_ORIGIN — the public base of THIS worker; the cron uses it to build absolute
# unsubscribe links on the weekly digest (comms-prefs Phase 2). Unset → digests
# send without the unsubscribe footer/headers (degrade, never a broken link).
API_ORIGIN = "https://api.shipaso.com"
# REPORT_PAGE_ORIGIN — the origin the public report pages (GET /r/:appId)
# declare as canonical. Paired with the `shipaso.com/r/*` route above; set
# only while that route is live. Unset → the request origin.
REPORT_PAGE_ORIGIN = "https://shipaso.com"
# COOKIE_DOMAIN — shares the session cookie across the dashboard (app.shipaso.com)
# and API (api.shipaso.com) subdomains, with SameSite=None so it rides cross-site
# fetches. Leave unset for single-origin / local dev (→ host-only, SameSite=Lax).
COOKIE_DOMAIN = ".shipaso.com"
# MAGIC_LINK_BASE — the host the sign-in email links to. Must be the host the
# iOS app declares in `applinks:` (ASSOCIATED_HOST in mobile/app.config.ts), so
# the link is a UNIVERSAL LINK that opens the app; it falls back to the cookie
# flow in a browser.
#
# A plain public URL — it appears in the email body — so it belongs here in
# [vars] and NOT in `wrangler secret`. Declared here it deploys with the worker;
# as a secret it would be a manual step someone has to remember, which is how it
# came to be unset in production in the first place.
#
# Unset ⇒ links fall back to `${requestOrigin}/auth/callback` on api.shipaso.com,
# which is NOT an associated domain — so the link opens Safari and stays there.
# That is exactly what App Review hit: "The sign in link does not link user back
# to the app" (Guideline 2.1(a), submission a64749cd, 2026-07-29).
MAGIC_LINK_BASE = "https://shipaso.com"
# ASC_WRITE_ENABLED — opt-in direct App Store Connect writes (#11/#179): the
# approve → push routes (metadata, create-version, per-locale). Off/unset →
# those routes 403 and the credential-free Fastlane handoff is the only path.
# The stored-credential flow additionally needs CRED_KEK_V1 (secret, below).
ASC_WRITE_ENABLED = "true"
# ASC_EXPERIMENT_WRITE_ENABLED — the one write that can change what real App
# Store visitors see (#374): POST /runs/:id/asc/create-experiment. Creates a
# product page experiment STOPPED; starting traffic stays a button in App Store
# Connect. Own flag on top of ASC_WRITE_ENABLED. Turned on 2026-09-06 for the
# first live verification against Snagg.
ASC_EXPERIMENT_WRITE_ENABLED = "true"

# ── Secrets (DO NOT put values here — set via `wrangler secret put NAME`) ─────
# Auth:
#   SESSION_SECRET        — HMAC key signing magic-link + session tokens.
#                           REQUIRED outside demo (demo uses a dev fallback).
# Billing (Stripe):
#   STRIPE_SECRET_KEY     — Stripe secret key (Bearer for the REST API), test OR
#                           live. (Legacy STRIPE_TEST_KEY is still read as a
#                           fallback during migration; prefer the new name.)
#   STRIPE_WEBHOOK_SECRET — verifies the Stripe-Signature on /billing/webhook.
#   STRIPE_PRICE_INDIE    — Price id for Indie ($6.99/mo subscription).
#   STRIPE_PRICE_STARTUP  — Price id for Startup ($19.99/mo subscription).
#   STRIPE_PRICE_SCALE    — Price id for Scale ($64.99/mo subscription).
# Egress:
#   TINYFISH_API_KEY      — routes iTunes calls through TinyFish Fetch (clean egress).
#     REQUIRED in production: Apple 403s iTunes /search from Cloudflare egress IPs.
#     Unset → engine uses direct fetch (fine locally, blocked when deployed).
# Email (magic-link delivery):
#   RESEND_API_KEY        — Resend API key. With it (+ RESEND_FROM) /auth/request
#                           emails the magic link; unset → link is logged only.
#   RESEND_FROM           — verified Resend sender on a domain we own, e.g.
#                           "ShipASO <login@shipaso.com>". The domain must be
#                           verified in Resend (SPF + DKIM) or mail fails DMARC.
#                           Set as a [vars] entry or a secret — either works.
#
#   npx wrangler secret put SESSION_SECRET
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_PRICE_INDIE
#   npx wrangler secret put STRIPE_PRICE_STARTUP
#   npx wrangler secret put STRIPE_PRICE_SCALE
#   npx wrangler secret put TINYFISH_API_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put RESEND_FROM   # (or add to [vars])
# Credential vault (#67/#179):
#   CRED_KEK_V1           — base64 of 32 random bytes; the AES-256-GCM key
#     wrapping stored store credentials. Unset → credential storage (and the
#     keyed sweep / one-click push) is disabled. Generate + set:
#       openssl rand -base64 32 | npx wrangler secret put CRED_KEK_V1
#     Keep a copy in your password manager — losing it orphans stored keys
#     (users simply re-connect; nothing is recoverable from D1 alone).
#
#     ⚠️ NEVER overwrite CRED_KEK_V1 with a NEW value. Rotation is ADDITIVE:
#     set CRED_KEK_V2 and leave V1 in place. currentKek() prefers V2, and
#     useCredential lazily re-wraps each row's DEK under it on read
#     (credentialStore.ts), so rows migrate with zero downtime and V1 can be
#     retired once none remain. Writing a new value into V1 instead replaces
#     the key that opens existing rows and orphans every one of them —
#     it happened on 2026-07-26 (#372).
#
#     Before setting a KEK, CHECK WHETHER ONE ALREADY EXISTS. `wrangler secret
#     list` output can be long — grep for the exact name rather than eyeballing:
#       npx wrangler secret list | grep CRED_KEK
#     Since #372 an orphaned row fails honestly (CredentialUnreadableError; the
#     UI marks the key unreadable and withholds push) instead of a raw crypto
#     error, but the credential is still unrecoverable. Prevention is the fix.
# (The STRIPE_PRICE_* are not really secret — you may instead put them in [vars].)

# ── Pages (dashboard frontend) — NOT configured by this file ─────────────────
# The dashboard is the TanStack app in cloud/web/, deployed to Cloudflare Pages
# separately. Build it, then deploy the generated dist/:
#   npm run build:combined     # vite build → cloud/web/dist, then web-enable.mjs
#   npx wrangler pages deploy dist --project-name store-ops-dashboard
# `build:combined` makes the app's own build the deploy root and emits the
# advanced-mode _worker.js. cloud/web/public/ rides along verbatim, carrying
# _headers, config.js, the /auth/m magic-link landing and .well-known/*.
#
# (This previously described a hand-written static dashboard at cloud/public/.
# That directory was deleted in #356 Phase 3 — the app IS the site now.)
# Point the dashboard at this Worker's URL (set API_BASE in the dashboard, see
# README). Keeping Pages + Worker separate is the standard Cloudflare split:
# Worker = API/engine/cron, Pages = the built app.
